services:
  mongo-origen:
    image: mongo:8.0
    container_name: mongodb-origen
    ports:
      - "27017:27017"
    volumes:
      - mongo_origen_data:/data/db

  mongo-destino:
    image: mongo:8.0
    container_name: mongodb-destino
    ports:
      - "27018:27017"
    volumes:
      - mongo_destino_data:/data/db

volumes:
  mongo_origen_data:
  mongo_destino_data: